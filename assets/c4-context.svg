<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" role="img" aria-label="mcl-whiteboard system context">
<title>mcl-whiteboard system context</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1100" height="780"/>
<rect class="b-per" x="40" y="30" width="300" height="136" rx="10"/>
<circle class="head" cx="66" cy="54" r="9"/>
<text class="t-name" x="84" y="58">Board host</text>
<text class="t-type" x="84" y="76">[Person]</text>
<text class="t-desc" x="56" y="100">Runs this service on their own node</text>
<text class="t-desc" x="56" y="116">and opens /boards in a browser</text>
<text class="t-desc" x="56" y="132">on port 4000. Their node is the</text>
<text class="t-desc" x="56" y="148">authority for the boards it hosts.</text>
<rect class="b-per" x="740" y="30" width="300" height="136" rx="10"/>
<circle class="head" cx="766" cy="54" r="9"/>
<text class="t-name" x="784" y="58">Collaborator</text>
<text class="t-type" x="784" y="76">[Person]</text>
<text class="t-desc" x="756" y="100">Finds a board over the mesh, gets</text>
<text class="t-desc" x="756" y="116">a snapshot, then live updates, and</text>
<text class="t-desc" x="756" y="132">draws on it: the writes are relayed</text>
<text class="t-desc" x="756" y="148">to the host.</text>
<rect class="b-sys" x="390" y="230" width="320" height="152" rx="10"/>
<text class="t-name" x="406" y="258">mcl-whiteboard</text>
<text class="t-type" x="406" y="276">[mcl_om mesh service, own box]</text>
<text class="t-desc" x="406" y="300">Hosts boards and serves the canvas</text>
<text class="t-desc" x="406" y="316">on 4000, publishes every board and</text>
<text class="t-desc" x="406" y="332">shape fact, and relays a remote</text>
<text class="t-desc" x="406" y="348">peer's writes to the board's host.</text>
<text class="t-desc" x="406" y="364">One release, six OTP apps.</text>
<rect class="b-mac" x="40" y="470" width="300" height="152" rx="10"/>
<text class="t-name" x="56" y="498">macula-realm</text>
<text class="t-type" x="56" y="516">[Macula infrastructure]</text>
<text class="t-desc" x="56" y="540">Endorses the node's identity key and</text>
<text class="t-desc" x="56" y="556">grants the scope mcl-whiteboard. The</text>
<text class="t-desc" x="56" y="572">procedures are mcl_om's</text>
<text class="t-desc" x="56" y="588">mcl-whiteboard/info and</text>
<text class="t-desc" x="56" y="604">mcl-whiteboard/get_limits, both open.</text>
<rect class="b-mac" x="390" y="470" width="320" height="136" rx="10"/>
<text class="t-name" x="406" y="498">Macula stations, mesh DHT</text>
<text class="t-type" x="406" y="516">[Macula infrastructure]</text>
<text class="t-desc" x="406" y="540">The pinned seeds in</text>
<text class="t-desc" x="406" y="556">MACULA_STATION_SEEDS carry every fact,</text>
<text class="t-desc" x="406" y="572">write relay and query (QUIC); the</text>
<text class="t-desc" x="406" y="588">DHT holds the node's advertisement.</text>
<rect class="b-ext" x="740" y="470" width="300" height="152" rx="10"/>
<text class="t-name" x="756" y="498">Another host's node</text>
<text class="t-type" x="756" y="516">[External system]</text>
<text class="t-desc" x="756" y="540">Another box running this service,</text>
<text class="t-desc" x="756" y="556">and the authority for its boards.</text>
<text class="t-desc" x="756" y="572">The list query is answered by every</text>
<text class="t-desc" x="756" y="588">host with boards; the snapshot query</text>
<text class="t-desc" x="756" y="604">only by that board's host.</text>
<path class="edge" d="M190 166V200H430V230" marker-end="url(#a)"/>
<text class="t-rel" x="198" y="180">opens the canvas on port 4000</text>
<path class="edge" d="M950 166V200H670V230" marker-end="url(#a)"/>
<text class="t-rel" x="940" y="192" text-anchor="end">joins a board, local or remote</text>
<path class="edge" d="M470 382V420H190V470" marker-end="url(#a)"/>
<text class="t-rel" x="300" y="412" text-anchor="middle">boot claim, scope mcl-whiteboard</text>
<path class="edge" d="M550 382V470" marker-end="url(#a)"/>
<text class="t-rel" x="558" y="404">board and shape facts,</text>
<text class="t-rel" x="558" y="420">write relays and queries</text>
<path class="edge" d="M710 300H890V470" marker-end="url(#a)"/>
<text class="t-rel" x="718" y="292">queries reach every host</text>
<text class="t-desc" x="40" y="640">Nothing outside the mesh is called: the board list and the snapshots come from other hosts over pubsub.</text>
<text class="t-desc" x="40" y="658">The service serves no procedure of its own, and capabilities/0 is empty. mcl_om adds mcl-whiteboard/info and</text>
<text class="t-desc" x="40" y="676">mcl-whiteboard/get_limits to every service, both open.</text>
<rect class="b-sys" x="24" y="716" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="728">In scope</text>
<rect class="b-per" x="110.8" y="716" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="728">Person</text>
<rect class="b-mac" x="184.39999999999998" y="716" width="22" height="14" rx="3"/>
<text class="t-leg" x="214.39999999999998" y="728">Macula infrastructure</text>
<rect class="b-ext" x="357.0" y="716" width="22" height="14" rx="3"/>
<text class="t-leg" x="387.0" y="728">External system</text>
<rect class="b-cmp" x="490.0" y="716" width="22" height="14" rx="3"/>
<text class="t-leg" x="520.0" y="728">Container or component</text>
</svg>
