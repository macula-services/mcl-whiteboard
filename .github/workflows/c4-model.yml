# The service's C4 model: what it talks to, and what it is made of
# (macula-codebase-checks#10). Two diagrams in assets/, a context one and a
# component one, each shown by README.md or architecture/README.md, and this
# workflow red until they are there.
#
# WHY ITS OWN FILE. The model is the reader's, not the deploy's: the
# mcl_service template keeps it out of the image's path on purpose, so a red
# diagram must never block a publish. That rules out the lint workflow, which
# the image job takes as its test wherever it has one. It also rules out the
# image workflow itself: it runs on a main push, a v* tag and a dispatch, and
# where it does run for a pull request it ignores a change that is only a
# diagram or a README. So the gate is its own workflow, started by every pull
# request and by a push to main, with no path filter.
#
# The check is the house's, pinned by full commit sha as every shared call is.

name: c4 model

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  c4-model:
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/c4-model.yml@399162a9d3dcac07b904ed12f203f42165c577e8

  # The committed SVGs are what architecture/c4_diagrams.py draws today, and every
  # box the plan has not built yet is drawn as planned (architecture/README.md,
  # "Planned boxes"). Its own job here, not in ci.yml: ci.yml ignores assets/**,
  # so a pull request that changes only an SVG would never run it, and ci.yml's
  # test image has no python3. ubuntu-latest has python3.
  c4-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4, the major ci.yml uses, pinned by full commit sha.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: The diagrams match their generator
        run: |
          # Every C4 SVG is removed first, so one the generator no longer draws shows as deleted.
          rm -f assets/c4-*.svg
          python3 architecture/c4_diagrams.py
          drift="$(git status --porcelain -- assets/)"
          if [ -n "$drift" ]; then
            git --no-pager diff --stat -- assets/
            echo "c4-drift: assets/ differs from what architecture/c4_diagrams.py draws:"
            echo "$drift"
            echo "Run python3 architecture/c4_diagrams.py and commit the SVGs with the generator."
            exit 1
          fi
          echo "c4-drift: every SVG in assets/ is what the generator draws"
      - name: Every planned box is drawn as planned
        run: python3 architecture/test_c4_planned_boxes.py
